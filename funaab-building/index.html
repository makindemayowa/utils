<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funaab Building Tracker</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-light: #2d6a4f;
      --success: #1e8449;
      --warning: #d68910;
      --danger: #c0392b;
      --bg: #f0f4f8;
      --card-bg: #fff;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --border: #dce1e7;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-sub { font-size: 11px; opacity: 0.65; margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .sync-status {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }
    .sync-ok      { background: rgba(39,174,96,0.25);  color: #a9dfbf; }
    .sync-saving  { background: rgba(241,196,15,0.25); color: #f9e79f; }
    .sync-error   { background: rgba(231,76,60,0.25);  color: #f1948a; }
    .sync-offline { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
    .hbtn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .hbtn:hover { background: rgba(255,255,255,0.25); }

    /* ── Setup banner ── */
    .setup-banner {
      background: #fff3cd;
      border-bottom: 2px solid #ffc107;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .setup-banner strong { color: #856404; }
    .setup-banner a { color: var(--primary); cursor: pointer; text-decoration: underline; }

    /* ── Tabs ── */
    .tabs {
      background: #fff;
      display: flex;
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      padding: 12px 22px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab:hover:not(.active) { color: var(--text); background: #f9fafb; }

    /* ── Content ── */
    .content { padding: 16px; max-width: 1100px; margin: 0 auto; }

    /* ── Cards ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card { background: var(--card-bg); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
    .card-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .card-val { font-size: 22px; font-weight: 800; }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .green { color: var(--success); }
    .red   { color: var(--danger); }
    .blue  { color: var(--primary); }
    .amber { color: var(--warning); }

    /* ── Section ── */
    .section { background: var(--card-bg); border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
    .sec-head { padding: 13px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sec-title { font-weight: 700; font-size: 13px; }

    /* ── Progress bar ── */
    .progress-wrap { background: #e9ecef; border-radius: 8px; height: 10px; overflow: hidden; margin: 0 0 20px; }
    .progress-bar { height: 100%; border-radius: 8px; transition: width 0.4s; }
    .progress-green { background: var(--success); }
    .progress-amber { background: var(--warning); }
    .progress-red   { background: var(--danger); }

    /* ── Phase bar (inline) ── */
    .phase-bar-wrap { background: #e9ecef; border-radius: 4px; height: 6px; flex: 1; overflow: hidden; margin-left: 10px; }
    .phase-bar { height: 100%; background: var(--primary-light); border-radius: 4px; }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8f9fa; padding: 9px 12px; text-align: left; font-weight: 700; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }
    td.total-row { font-weight: 700; background: #f8f9fa; }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; }
    .b-green  { background: #d5f5e3; color: #1e8449; }
    .b-red    { background: #fadbd8; color: #c0392b; }
    .b-amber  { background: #fef9e7; color: #d68910; border: 1px solid #f0ca24; }
    .b-gray   { background: #eaecee; color: #7f8c8d; }
    .b-blue   { background: #d6eaf8; color: #1a5276; }
    .b-teal   { background: #d1f2eb; color: #1b4332; }
    .b-orange { background: #fdebd0; color: #d35400; }

    /* ── Buttons ── */
    .btn { padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm      { padding: 5px 11px; font-size: 12px; }
    .abn { background: none; border: none; cursor: pointer; padding: 3px 6px; border-radius: 4px; font-size: 13px; color: var(--muted); line-height: 1; }
    .abn:hover { background: #f0f0f0; color: var(--text); }
    .abn:disabled { opacity: 0.3; cursor: default; }
    .abn:disabled:hover { background: none; }

    /* ── Filter bar ── */
    .filter-bar { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-bar select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--text); background: #fff; cursor: pointer; }

    /* ── Recent activity rows ── */
    .act-row { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .act-row:last-child { border-bottom: none; }
    .act-date { color: var(--muted); font-size: 12px; min-width: 90px; }
    .act-lbl { flex: 1; }
    .act-amt { font-weight: 700; text-align: right; white-space: nowrap; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-ico { font-size: 36px; margin-bottom: 10px; }

    /* ── Modal ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .overlay.on { display: flex; }
    .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-hd { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-hd-title { font-weight: 700; font-size: 16px; }
    .modal-x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; padding: 0 4px; }
    .modal-bd { padding: 20px; }
    .modal-ft { padding: 13px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

    /* ── Form ── */
    .fg { margin-bottom: 14px; }
    .fg:last-child { margin-bottom: 0; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: var(--text); background: #fff; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,67,50,0.12); }
    input[readonly] { background: #f8f9fa; color: var(--muted); cursor: default; }
    .fr { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint-box { background: #f0f4f8; padding: 8px 12px; border-radius: 6px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .help-text { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

    /* ── Phase manager (settings) ── */
    .phase-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .phase-item:last-child { border-bottom: none; }
    .phase-name { flex: 1; font-size: 13px; }
    .phase-edit-input { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; }
    .settings-section { padding: 16px; border-bottom: 1px solid var(--border); }
    .settings-section:last-child { border-bottom: none; }
    .settings-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .input-row input { flex: 1; }

    @media (max-width: 480px) {
      .fr { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr 1fr; }
      .filter-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-sub">FUNAAB BUILDING</div>
    <div class="header-title">Construction Tracker</div>
  </div>
  <div class="header-right">
    <div class="sync-status sync-offline" id="sync-status">Not connected</div>
  </div>
</header>

<div id="setup-banner" style="display:none" class="setup-banner">
  <span>⚠ <strong>Not connected to Google Sheets.</strong> Data is saved locally only.</span>
  <a onclick="showTab('settings')">Connect now →</a>
</div>

<div class="tabs">
  <div class="tab active" id="tab-dashboard" onclick="showTab('dashboard')">Dashboard</div>
  <div class="tab"        id="tab-expenses"  onclick="showTab('expenses')">Expenses</div>
  <div class="tab"        id="tab-transfers" onclick="showTab('transfers')">Funding</div>
  <div class="tab"        id="tab-settings"  onclick="showTab('settings')">Settings</div>
</div>

<div class="content">
  <div id="view-dashboard"></div>
  <div id="view-expenses"  style="display:none"></div>
  <div id="view-transfers" style="display:none"></div>
  <div id="view-settings"  style="display:none"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-hd">
      <div class="modal-hd-title" id="m-title"></div>
      <button class="modal-x" onclick="hideModal()">×</button>
    </div>
    <div class="modal-bd" id="m-body"></div>
    <div class="modal-ft" id="m-foot"></div>
  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const CACHE_KEY  = 'funaab-building-v1';
const CONFIG_KEY = 'funaab-building-config-v1';

const CATEGORIES = ['Labour', 'Materials', 'Equipment', 'Professional Fees', 'Permits / Legal', 'Other'];

const DEFAULT_PHASES = [
  { id: 'p1', name: 'Foundation',        order: 1 },
  { id: 'p2', name: 'Structure / Frame', order: 2 },
  { id: 'p3', name: 'Roofing',           order: 3 },
  { id: 'p4', name: 'Finishing',         order: 4 }
];

// ─── State ────────────────────────────────────────────────────────────────────
let db = { budget: 0, phases: [], expenses: [], transfers: [], funding: [] };
let config = { scriptUrl: '' };
let isSyncing = false;
let activeTab = 'dashboard';
let filterPhase = '';
let filterCat   = '';

// ─── Config persistence ───────────────────────────────────────────────────────
function loadConfig() {
  try { config = Object.assign({ scriptUrl: '' }, JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}')); } catch(e) {}
}
function saveConfig() {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
}

// ─── Cache (localStorage) ─────────────────────────────────────────────────────
function mergeDefaults(raw) {
  const out = Object.assign({ budget: 0, phases: [], expenses: [], transfers: [], funding: [] }, raw);
  if (!out.phases || !out.phases.length) out.phases = DEFAULT_PHASES.map(p => Object.assign({}, p));
  return out;
}
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) db = mergeDefaults(JSON.parse(raw));
    else db = mergeDefaults({});
  } catch(e) { db = mergeDefaults({}); }
}
function writeCache() {
  localStorage.setItem(CACHE_KEY, JSON.stringify(db));
}

// ─── Google Sheets sync ───────────────────────────────────────────────────────
function setSyncStatus(state, text) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-status ' + state;
  el.textContent = text;
}

async function fetchFromSheets() {
  if (!config.scriptUrl) return false;
  try {
    setSyncStatus('sync-saving', 'Loading…');
    const res  = await fetch(config.scriptUrl + '?app=building');
    const data = await res.json();
    if (typeof data.budget === 'undefined' || !Array.isArray(data.expenses)) throw new Error('Bad response');
    db = mergeDefaults(data);
    writeCache();
    setSyncStatus('sync-ok', 'Synced ✓');
    return true;
  } catch(e) {
    setSyncStatus('sync-error', 'Sync error');
    return false;
  }
}

async function pushToSheets() {
  if (!config.scriptUrl || isSyncing) return;
  isSyncing = true;
  setSyncStatus('sync-saving', 'Saving…');
  try {
    await fetch(config.scriptUrl, {
      method: 'POST',
      body: JSON.stringify(db),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      mode: 'no-cors'
    });
    setSyncStatus('sync-ok', 'Saved ✓');
  } catch(e) {
    setSyncStatus('sync-error', 'Save failed');
  } finally {
    isSyncing = false;
  }
}

function save() {
  writeCache();
  pushToSheets();
}

// Auto-refresh
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchFromSheets().then(render);
});
setInterval(() => {
  if (document.visibilityState === 'visible') fetchFromSheets().then(ok => { if (ok) render(); });
}, 60000);

// ─── Helpers ──────────────────────────────────────────────────────────────────
function uid()      { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function naira(n) {
  return '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function sortedPhases() {
  return [...db.phases].sort((a, b) => a.order - b.order);
}
function phaseName(phaseId) {
  const p = db.phases.find(p => p.id === phaseId);
  return p ? p.name : 'Unknown';
}

// ─── Computed totals ──────────────────────────────────────────────────────────
function totalSpent()       { return db.expenses.reduce((s, e) => s + Number(e.amount), 0); }
function remaining()        { return db.budget - totalSpent(); }
function pctComplete()      { return db.budget > 0 ? totalSpent() / db.budget * 100 : 0; }
function totalFunding()     { return db.funding.reduce((s, f) => s + Number(f.amount), 0); }
function balanceAvailable() { return totalFunding() - totalSpent(); }
function spentByPhase() {
  const map = {};
  db.phases.forEach(p => { map[p.id] = 0; });
  db.expenses.forEach(e => {
    if (map[e.phaseId] !== undefined) map[e.phaseId] += Number(e.amount);
    else map[e.phaseId] = Number(e.amount);
  });
  return map;
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('[id^="view-"]').forEach(el => el.style.display = 'none');
  document.getElementById('view-' + name).style.display = '';
  activeTab = name;
  render();
}
function render() {
  if (activeTab === 'dashboard') renderDashboard();
  if (activeTab === 'expenses')  renderExpenses();
  if (activeTab === 'transfers') renderTransfers();
  if (activeTab === 'settings')  renderSettings();
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const el      = document.getElementById('view-dashboard');
  const spent   = totalSpent();
  const rem     = remaining();
  const pct     = pctComplete();
  const byPhase = spentByPhase();

  // KPI cards
  let pctColor = 'green';
  if (pct >= 90) pctColor = 'red';
  else if (pct >= 70) pctColor = 'amber';

  const remColor = rem >= 0 ? 'green' : 'red';

  let cards = `<div class="cards">
    <div class="card">
      <div class="card-lbl">Total Budget</div>
      <div class="card-val amber">${db.budget > 0 ? naira(db.budget) : '—'}</div>
      <div class="card-sub">Set in Settings</div>
    </div>
    <div class="card">
      <div class="card-lbl">Total Spent</div>
      <div class="card-val red">${naira(spent)}</div>
      <div class="card-sub">${db.expenses.length} expense${db.expenses.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="card">
      <div class="card-lbl">Remaining</div>
      <div class="card-val ${remColor}">${db.budget > 0 ? naira(rem) : '—'}</div>
      <div class="card-sub">${db.budget > 0 ? (rem >= 0 ? 'Under budget' : 'Over budget') : 'No budget set'}</div>
    </div>
    <div class="card">
      <div class="card-lbl">% Complete</div>
      <div class="card-val ${pctColor}">${db.budget > 0 ? pct.toFixed(1) + '%' : '—'}</div>
      <div class="card-sub">Of budget spent</div>
    </div>
    <div class="card">
      <div class="card-lbl">Funding Received</div>
      <div class="card-val blue">${naira(totalFunding())}</div>
      <div class="card-sub">${db.funding.length} funding record${db.funding.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="card">
      <div class="card-lbl">Balance in Hand</div>
      <div class="card-val ${balanceAvailable() >= 0 ? 'green' : 'red'}">${naira(balanceAvailable())}</div>
      <div class="card-sub">Received − Spent</div>
    </div>
  </div>`;

  // Progress bar
  let progressBar = '';
  if (db.budget > 0) {
    const w = Math.min(pct, 100).toFixed(1);
    let cls = 'progress-green';
    if (pct >= 90) cls = 'progress-red';
    else if (pct >= 70) cls = 'progress-amber';
    progressBar = `<div class="progress-wrap"><div class="progress-bar ${cls}" style="width:${w}%"></div></div>`;
  }

  // Phase summary
  const phases = sortedPhases();
  let phaseRows = '';
  if (phases.length) {
    phases.forEach(p => {
      const amt = byPhase[p.id] || 0;
      const phasePct = spent > 0 ? (amt / spent * 100) : 0;
      phaseRows += `<tr>
        <td>${p.name}</td>
        <td>${naira(amt)}</td>
        <td style="min-width:120px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="min-width:40px;text-align:right;font-size:12px;color:var(--muted)">${phasePct.toFixed(0)}%</span>
            <div class="phase-bar-wrap"><div class="phase-bar" style="width:${phasePct.toFixed(1)}%"></div></div>
          </div>
        </td>
      </tr>`;
    });
  } else {
    phaseRows = '<tr><td colspan="3" class="empty" style="padding:20px">No phases yet — add them in Settings</td></tr>';
  }

  const phaseSummary = `<div class="section">
    <div class="sec-head"><span class="sec-title">Spend by Phase</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Phase</th><th>Spent</th><th>% of total</th></tr></thead>
      <tbody>${phaseRows}</tbody>
    </table></div>
  </div>`;

  // Recent activity (last 10 combined)
  const expActs = db.expenses.map(e => ({
    date: e.date,
    type: 'expense',
    label: (phaseName(e.phaseId) + ' — ' + e.category + (e.description ? ': ' + e.description : '')),
    amt: naira(e.amount),
    id: e.id
  }));
  const fndActs = db.funding.map(f => ({
    date: f.date,
    type: 'funding',
    label: 'Money received' + (f.notes ? ' — ' + f.notes : ''),
    amt: naira(f.amount),
    id: f.id
  }));

  const recent = [...expActs, ...fndActs].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);

  let actRows = '';
  if (recent.length) {
    recent.forEach(r => {
      const badge = r.type === 'expense'
        ? '<span class="badge b-teal">Expense</span>'
        : '<span class="badge b-orange">Funding</span>';
      actRows += `<div class="act-row">
        <span class="act-date">${fmtDate(r.date)}</span>
        ${badge}
        <span class="act-lbl">${r.label}</span>
        <span class="act-amt">${r.amt}</span>
      </div>`;
    });
  } else {
    actRows = '<div class="empty"><div class="empty-ico">📋</div>No activity yet</div>';
  }

  const recentSection = `<div class="section">
    <div class="sec-head"><span class="sec-title">Recent Activity</span></div>
    ${actRows}
  </div>`;

  el.innerHTML = cards + progressBar + phaseSummary + recentSection;
}

// ─── Expenses ─────────────────────────────────────────────────────────────────
function renderExpenses() {
  const el = document.getElementById('view-expenses');
  const phases = sortedPhases();

  // Build phase options for filter
  let phaseOpts = '<option value="">All Phases</option>';
  phases.forEach(p => {
    phaseOpts += `<option value="${p.id}" ${filterPhase === p.id ? 'selected' : ''}>${p.name}</option>`;
  });

  let catOpts = '<option value="">All Categories</option>';
  CATEGORIES.forEach(c => {
    catOpts += `<option value="${c}" ${filterCat === c ? 'selected' : ''}>${c}</option>`;
  });

  // Filter
  let rows = db.expenses.filter(e => {
    if (filterPhase && e.phaseId !== filterPhase) return false;
    if (filterCat && e.category !== filterCat) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));

  const filteredTotal = rows.reduce((s, e) => s + Number(e.amount), 0);

  let tRows = '';
  if (rows.length) {
    rows.forEach(e => {
      tRows += `<tr>
        <td>${fmtDate(e.date)}</td>
        <td>${phaseName(e.phaseId)}</td>
        <td><span class="badge b-gray">${e.category}</span></td>
        <td>${e.description || '—'}</td>
        <td>${e.vendor || '—'}</td>
        <td style="text-align:right;font-weight:600">${naira(e.amount)}</td>
        <td style="white-space:nowrap">
          <button class="abn" onclick="openExpenseForm('${e.id}')" title="Edit">✏</button>
          <button class="abn" onclick="deleteExpense('${e.id}')" title="Delete">🗑</button>
        </td>
      </tr>`;
    });
    tRows += `<tr>
      <td colspan="5" class="total-row" style="text-align:right;font-size:12px;color:var(--muted)">
        ${rows.length} record${rows.length !== 1 ? 's' : ''} — Total
      </td>
      <td class="total-row" style="text-align:right">${naira(filteredTotal)}</td>
      <td class="total-row"></td>
    </tr>`;
  } else {
    tRows = '<tr><td colspan="7"><div class="empty"><div class="empty-ico">🧾</div>No expenses yet — add one above</div></td></tr>';
  }

  el.innerHTML = `<div class="section">
    <div class="sec-head">
      <span class="sec-title">Expenses</span>
      <button class="btn btn-primary btn-sm" onclick="openExpenseForm()">+ Add Expense</button>
    </div>
    <div class="filter-bar">
      <select onchange="filterPhase=this.value;renderExpenses()">${phaseOpts}</select>
      <select onchange="filterCat=this.value;renderExpenses()">${catOpts}</select>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Phase</th><th>Category</th><th>Description</th><th>Vendor</th><th style="text-align:right">Amount</th><th></th></tr></thead>
      <tbody>${tRows}</tbody>
    </table></div>
  </div>`;
}

function openExpenseForm(id) {
  const e = id ? db.expenses.find(x => x.id === id) : null;
  const phases = sortedPhases();

  let phaseOpts = phases.map(p =>
    `<option value="${p.id}" ${e && e.phaseId === p.id ? 'selected' : ''}>${p.name}</option>`
  ).join('');

  let catOpts = CATEGORIES.map(c =>
    `<option value="${c}" ${e && e.category === c ? 'selected' : ''}>${c}</option>`
  ).join('');

  document.getElementById('m-title').textContent = e ? 'Edit Expense' : 'Add Expense';
  document.getElementById('m-body').innerHTML = `
    <div class="fg">
      <label>Date</label>
      <input type="date" id="e-date" value="${e ? e.date : todayStr()}">
    </div>
    <div class="fr">
      <div class="fg">
        <label>Phase</label>
        <select id="e-phase">${phaseOpts}</select>
      </div>
      <div class="fg">
        <label>Category</label>
        <select id="e-cat">${catOpts}</select>
      </div>
    </div>
    <div class="fg">
      <label>Description</label>
      <input type="text" id="e-desc" placeholder="What was this for?" value="${e ? e.description || '' : ''}">
    </div>
    <div class="fg">
      <label>Vendor / Paid To</label>
      <input type="text" id="e-vendor" placeholder="Optional" value="${e ? e.vendor || '' : ''}">
    </div>
    <div class="fg">
      <label>Amount (₦)</label>
      <input type="number" id="e-amount" placeholder="0" min="0" value="${e ? e.amount : ''}">
    </div>`;
  document.getElementById('m-foot').innerHTML = `
    <button class="btn btn-ghost" onclick="hideModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveExpense('${id || ''}')">Save</button>`;
  showModal();
}

function saveExpense(editId) {
  const date   = document.getElementById('e-date').value;
  const phaseId= document.getElementById('e-phase').value;
  const cat    = document.getElementById('e-cat').value;
  const desc   = document.getElementById('e-desc').value.trim();
  const vendor = document.getElementById('e-vendor').value.trim();
  const amount = parseFloat(document.getElementById('e-amount').value);

  if (!date || !phaseId || !cat || isNaN(amount) || amount < 0) {
    alert('Please fill in Date, Phase, Category, and Amount.');
    return;
  }

  if (editId) {
    const idx = db.expenses.findIndex(e => e.id === editId);
    if (idx !== -1) db.expenses[idx] = { ...db.expenses[idx], date, phaseId, category: cat, description: desc, vendor, amount };
  } else {
    db.expenses.push({ id: uid(), date, phaseId, category: cat, description: desc, vendor, amount });
  }

  save();
  hideModal();
  render();
}

function deleteExpense(id) {
  if (!confirm('Delete this expense?')) return;
  db.expenses = db.expenses.filter(e => e.id !== id);
  save();
  render();
}

// ─── Funding ──────────────────────────────────────────────────────────────────
function renderTransfers() {
  const el = document.getElementById('view-transfers');

  // Money received (direct-Naira funding)
  const fndTot = totalFunding();
  const fndSummary = `<div class="cards">
    <div class="card">
      <div class="card-lbl">Total Received (₦)</div>
      <div class="card-val green">${fndTot > 0 ? naira(fndTot) : '—'}</div>
      <div class="card-sub">${db.funding.length} record${db.funding.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="card">
      <div class="card-lbl">Balance in Hand</div>
      <div class="card-val ${balanceAvailable() >= 0 ? 'green' : 'red'}">${naira(balanceAvailable())}</div>
      <div class="card-sub">Received − Spent</div>
    </div>
  </div>`;

  const fndSorted = [...db.funding].sort((a, b) => b.date.localeCompare(a.date));
  let fRows = '';
  if (fndSorted.length) {
    fndSorted.forEach(f => {
      fRows += `<tr>
        <td>${fmtDate(f.date)}</td>
        <td style="font-weight:600">${naira(f.amount)}</td>
        <td>${f.notes || '—'}</td>
        <td style="white-space:nowrap">
          <button class="abn" onclick="openFundingForm('${f.id}')" title="Edit">✏</button>
          <button class="abn" onclick="deleteFunding('${f.id}')" title="Delete">🗑</button>
        </td>
      </tr>`;
    });
  } else {
    fRows = '<tr><td colspan="4"><div class="empty"><div class="empty-ico">💰</div>No funding recorded yet</div></td></tr>';
  }

  el.innerHTML = fndSummary + `<div class="section">
    <div class="sec-head">
      <span class="sec-title">Money Received (₦)</span>
      <button class="btn btn-primary btn-sm" onclick="openFundingForm()">+ Add Funding</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Amount</th><th>Notes</th><th></th></tr></thead>
      <tbody>${fRows}</tbody>
    </table></div>
  </div>`;
}

function openFundingForm(id) {
  const f = id ? db.funding.find(x => x.id === id) : null;

  document.getElementById('m-title').textContent = f ? 'Edit Funding' : 'Add Funding';
  document.getElementById('m-body').innerHTML = `
    <div class="fg">
      <label>Date</label>
      <input type="date" id="f-date" value="${f ? f.date : todayStr()}">
    </div>
    <div class="fg">
      <label>Amount (₦)</label>
      <input type="number" id="f-amount" placeholder="0" min="0" value="${f ? f.amount : ''}">
    </div>
    <div class="fg">
      <label>Notes</label>
      <input type="text" id="f-notes" placeholder="e.g. 1st money sent" value="${f ? f.notes || '' : ''}">
    </div>`;
  document.getElementById('m-foot').innerHTML = `
    <button class="btn btn-ghost" onclick="hideModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveFunding('${id || ''}')">Save</button>`;
  showModal();
}

function saveFunding(editId) {
  const date   = document.getElementById('f-date').value;
  const amount = parseFloat(document.getElementById('f-amount').value);
  const notes  = document.getElementById('f-notes').value.trim();

  if (!date || isNaN(amount) || amount <= 0) {
    alert('Please fill in Date and Amount.');
    return;
  }

  if (editId) {
    const idx = db.funding.findIndex(f => f.id === editId);
    if (idx !== -1) db.funding[idx] = { ...db.funding[idx], date, amount, notes };
  } else {
    db.funding.push({ id: uid(), date, amount, notes });
  }

  save();
  hideModal();
  render();
}

function deleteFunding(id) {
  if (!confirm('Delete this funding record?')) return;
  db.funding = db.funding.filter(f => f.id !== id);
  save();
  render();
}

// ─── Settings ─────────────────────────────────────────────────────────────────
function renderSettings() {
  const el = document.getElementById('view-settings');
  const phases = sortedPhases();

  let phaseItems = '';
  phases.forEach((p, i) => {
    const isFirst = i === 0;
    const isLast  = i === phases.length - 1;
    phaseItems += `<div class="phase-item" id="pi-${p.id}">
      <span class="phase-name" id="pn-${p.id}">${p.name}</span>
      <button class="abn" onclick="editPhaseInline('${p.id}')" title="Edit">✏</button>
      <button class="abn" onclick="movePhaseUp('${p.id}')" title="Move up" ${isFirst ? 'disabled' : ''}>↑</button>
      <button class="abn" onclick="movePhaseDown('${p.id}')" title="Move down" ${isLast ? 'disabled' : ''}>↓</button>
      <button class="abn" onclick="deletePhase('${p.id}')" title="Delete">🗑</button>
    </div>`;
  });

  el.innerHTML = `<div class="section">
    <div class="sec-head"><span class="sec-title">Settings</span></div>

    <div class="settings-section">
      <div class="settings-label">Google Sheets Sync</div>
      <div class="input-row">
        <input type="text" id="script-url" placeholder="Paste your Apps Script URL here" value="${config.scriptUrl || ''}">
        <button class="btn btn-primary btn-sm" onclick="saveScriptUrl()">Save</button>
      </div>
      <div class="help-text" style="margin-top:8px">
        1. Open your Google Sheet → Extensions → Apps Script<br>
        2. Paste the <code>apps-script.gs</code> content and deploy as a Web App (Execute as: Me, Anyone can access)<br>
        3. Copy the deployment URL and paste above
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">Total Budget (₦)</div>
      <div class="input-row">
        <input type="number" id="budget-input" placeholder="e.g. 50000000" min="0" value="${db.budget || ''}">
        <button class="btn btn-primary btn-sm" onclick="saveBudget()">Save</button>
      </div>
      <div class="help-text" style="margin-top:4px">Total planned spend for the building project in Naira</div>
    </div>

    <div class="settings-section">
      <div class="settings-label">Build Phases</div>
      <div id="phases-list">${phaseItems}</div>
      <div style="margin-top:12px" class="input-row">
        <input type="text" id="new-phase-name" placeholder="New phase name" style="flex:1">
        <button class="btn btn-success btn-sm" onclick="addPhase()">Add Phase</button>
      </div>
    </div>
  </div>`;
}

function saveScriptUrl() {
  const url = document.getElementById('script-url').value.trim();
  config.scriptUrl = url;
  saveConfig();
  if (url) {
    document.getElementById('setup-banner').style.display = 'none';
    fetchFromSheets().then(ok => { if (ok) render(); });
  } else {
    document.getElementById('setup-banner').style.display = '';
    setSyncStatus('sync-offline', 'Not connected');
  }
}

function saveBudget() {
  const val = parseFloat(document.getElementById('budget-input').value);
  if (isNaN(val) || val < 0) { alert('Enter a valid budget amount.'); return; }
  db.budget = val;
  save();
  render();
}

function addPhase() {
  const name = document.getElementById('new-phase-name').value.trim();
  if (!name) { alert('Enter a phase name.'); return; }
  const maxOrder = db.phases.reduce((m, p) => Math.max(m, p.order), 0);
  db.phases.push({ id: uid(), name, order: maxOrder + 1 });
  save();
  render();
}

function editPhaseInline(id) {
  const p    = db.phases.find(p => p.id === id);
  if (!p) return;
  const nameEl = document.getElementById('pn-' + id);
  const item   = document.getElementById('pi-' + id);
  if (!nameEl) return;

  nameEl.innerHTML = `<input class="phase-edit-input" id="pe-${id}" value="${p.name}" style="margin-right:6px">
    <button class="btn btn-primary btn-sm" onclick="savePhaseEdit('${id}')">Save</button>
    <button class="btn btn-ghost btn-sm" onclick="renderSettings()">Cancel</button>`;
}

function savePhaseEdit(id) {
  const input = document.getElementById('pe-' + id);
  if (!input) return;
  const name = input.value.trim();
  if (!name) { alert('Phase name cannot be empty.'); return; }
  const idx = db.phases.findIndex(p => p.id === id);
  if (idx !== -1) db.phases[idx].name = name;
  save();
  render();
}

function deletePhase(id) {
  const hasExpenses = db.expenses.some(e => e.phaseId === id);
  if (hasExpenses) {
    alert('This phase has expenses recorded — move or delete them first.');
    return;
  }
  if (!confirm('Delete this phase?')) return;
  db.phases = db.phases.filter(p => p.id !== id);
  save();
  render();
}

function movePhaseUp(id) {
  const sorted = sortedPhases();
  const idx    = sorted.findIndex(p => p.id === id);
  if (idx <= 0) return;
  const curr = db.phases.find(p => p.id === id);
  const prev = db.phases.find(p => p.id === sorted[idx - 1].id);
  const tmp  = curr.order;
  curr.order = prev.order;
  prev.order = tmp;
  save();
  render();
}

function movePhaseDown(id) {
  const sorted = sortedPhases();
  const idx    = sorted.findIndex(p => p.id === id);
  if (idx < 0 || idx >= sorted.length - 1) return;
  const curr = db.phases.find(p => p.id === id);
  const next = db.phases.find(p => p.id === sorted[idx + 1].id);
  const tmp  = curr.order;
  curr.order = next.order;
  next.order = tmp;
  save();
  render();
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function showModal() { document.getElementById('overlay').classList.add('on'); }
function hideModal() { document.getElementById('overlay').classList.remove('on'); }
function overlayClick(e) { if (e.target === document.getElementById('overlay')) hideModal(); }

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  loadConfig();
  loadCache();
  if (!config.scriptUrl) {
    document.getElementById('setup-banner').style.display = '';
    render();
  } else {
    fetchFromSheets().then(ok => render());
  }
});
</script>
</body>
</html>
